AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Order Processing System using Go and SAM
Parameters:
  OrdersTable:
    Type: String
    Description: The name of the DynamoDB table for orders
  OrderQueueArn:
    Type: String
    Description: The ARN of the SQS queue for order processing
Resources:
  ReceiptsBucket:
    Type: AWS::S3::Bucket
  ReceiveOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ReceiveOrderFunction
      Handler: bootstrap
      Runtime: provided.al2
      AutoPublishAlias: live
      FunctionName: receive-order
      MemorySize: 128
      Timeout: 30
      Architectures:
      - arm64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /orders
            Method: post
      Environment:
        Variables:
          QUEUE_URL:
            Ref: OrderQueueArn
      Policies:
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - OrderQueue
            - QueueName
    Metadata:
      BuildMethod: makefile
      SamResourceId: ReceiveOrderFunction
